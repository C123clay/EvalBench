name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
        include:
          - os: windows-latest
            python: "3.13"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Test
        run: python -m pytest

      # Exercise the documented CLI end to end, including both quality gates.
      - name: CLI smoke test
        shell: bash
        run: |
          evalbench validate examples/general_qa.jsonl
          evalbench run --dataset examples/general_qa.jsonl \
            --model "mock:oracle?accuracy=0.65&name=baseline" \
            --model "mock:oracle?accuracy=0.9&name=candidate" \
            --scorer contains --output results/qa.json --fail-under 0.5
          evalbench compare results/qa.json --baseline baseline --candidate candidate --fail-on-regression
          if evalbench run --dataset examples/general_qa.jsonl --model "mock:oracle?accuracy=0.3" --fail-under 0.9; then
            echo "expected --fail-under to fail"; exit 1
          fi
